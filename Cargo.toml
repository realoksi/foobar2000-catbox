[package]
name = "foobar2000-catbox"
version = "1.0.7"
edition = "2021"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies.serde]
version = "1.0.216"
features = ["derive"]

[dependencies.serde_yml]
version = "0.0.12"

[dependencies.strum]
version = "0.26.3"
features = ["strum_macros"]

[dependencies.strum_macros]
version = "0.26.4"

[dependencies.curl]
version = "0.4.47"

[dependencies.image]
version = "0.25.5"

[dependencies.audiotags]
version = "0.5.0"
