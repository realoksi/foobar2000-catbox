[package]
name = "foobar2000-catbox"
version = "1.0.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/realoksi/foobar2000-catbox"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies.anyhow]
version = "1.0.104"
default-features = false

[dependencies.toml]
version = "1.1.8"
default-features = false
features = ["parse", "serde"]

[dependencies.serde]
version = "1.0.229"
default-features = false
features = ["derive"]

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["png", "jpeg"]

[dependencies.webp]
version = "0.3.1"

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["blocking", "default-tls", "multipart"]

[dependencies.log]
version = "0.4.34"
default-features = false
