[package]
name = "foobar2000-catbox"
version = "1.0.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/realoksi/foobar2000-catbox"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies.base64]
version = "0.23.1"

[dependencies.serde]
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_yml]
version = "0.0.13"

[dependencies.strum]
version = "0.28.0"
default-features = false
features = ["strum_macros"]

[dependencies.strum_macros]
version = "0.28.0"

[dependencies.curl]
version = "0.4.47"

[dependencies.image]
version = "0.25.6"
default-features = false
features = ["png", "jpeg", "webp"]
