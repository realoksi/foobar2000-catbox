[package]
name = "foobar2000-catbox"
version = "1.0.9"
edition = "2021"

[profile.release]
strip = true
lto = true
codegen-units = 16

[dependencies.base64]
version = "0.22.1"

[dependencies.serde]
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_yml]
version = "0.0.12"

[dependencies.strum]
version = "0.27.1"
default-features = false
features = ["strum_macros"]

[dependencies.strum_macros]
version = "0.27.1"

[dependencies.curl]
version = "0.4.47"

[dependencies.image]
version = "0.25.6"
default-features = false
features = ["png", "jpeg", "webp"]
